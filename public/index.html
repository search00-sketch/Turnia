<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Turnia — Directorio de negocios</title>
  <meta name="description" content="Encontrá peluquerías, barberías, spas y otros negocios locales." />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Turnia</a>
      <nav class="nav-actions">
        <a id="header-auth-link" class="btn btn-secondary" href="login.html">Ingresar / Registrarme</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Encontrá negocios cerca tuyo</h1>
      <p>Peluquerías, barberías, spas y más. Cada negocio carga y actualiza su propia información.</p>
    </section>

    <section>
      <div class="filters">
        <input type="search" id="search" placeholder="Buscar por nombre o descripción…" aria-label="Buscar" />
        <select id="category-filter" aria-label="Filtrar por rubro">
          <option value="">Todos los rubros</option>
        </select>
      </div>

      <div id="grid" class="grid" aria-live="polite"></div>
      <div id="empty-state" class="empty-state" hidden>
        No encontramos negocios con esos filtros. Probá con otra búsqueda.
      </div>
    </section>
  </main>

  <footer class="site-footer">
    ¿Tenés un negocio? <a href="login.html">Sumalo a Turnia</a>.
  </footer>

  <script type="module" src="js/index.js"></script>
</body>
</html>
