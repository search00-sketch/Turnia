<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Turnia — Ingresar</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Turnia</a>
      <nav class="nav-actions">
        <a class="btn btn-secondary" href="index.html">Ver directorio</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="auth-wrap">
      <div class="tabs">
        <button type="button" class="tab-btn active" data-tab="tab-login">Iniciar sesión</button>
        <button type="button" class="tab-btn" data-tab="tab-register">Crear cuenta de negocio</button>
      </div>

      <div id="tab-login" class="tab-panel active">
        <form id="login-form">
          <div class="field">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" name="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="login-password">Contraseña</label>
            <input type="password" id="login-password" name="password" required autocomplete="current-password" />
          </div>
          <p id="login-msg" class="form-msg" role="alert"></p>
          <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
        </form>
      </div>

      <div id="tab-register" class="tab-panel">
        <form id="register-form">
          <div class="field">
            <label for="register-business-name">Nombre del negocio</label>
            <input type="text" id="register-business-name" name="businessName" required autocomplete="organization" />
          </div>
          <div class="field">
            <label for="register-email">Email</label>
            <input type="email" id="register-email" name="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="register-password">Contraseña</label>
            <input type="password" id="register-password" name="password" required minlength="6" autocomplete="new-password" />
            <p class="hint">Mínimo 6 caracteres.</p>
          </div>
          <p id="register-msg" class="form-msg" role="alert"></p>
          <button type="submit" class="btn btn-primary btn-block">Crear cuenta</button>
        </form>
      </div>
    </div>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
